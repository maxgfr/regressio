[package]
name = "regressio-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM acceleration engine for regressio"
repository = "https://github.com/maxgfr/regressio"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
